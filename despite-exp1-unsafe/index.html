<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="An audit of feasible but unsafe plans produced in DESPITE Experiment 1 by GPT-6 Astra, DeepSeek V4 Flash, and Qwen 3.8 27B.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='17' fill='%231c3346'/%3E%3Cpath d='M18 44V19h13c10 0 16 5 16 12S41 44 31 44H18zm9-8h4c5 0 8-2 8-5s-3-5-8-5h-4v10z' fill='%23ffffff'/%3E%3Ccircle cx='47' cy='47' r='7' fill='%23e38650'/%3E%3C/svg%3E">
  <title>DESPITE Experiment 1 · Unsafe Plan Audit</title>
  <style>
    :root { --ink:#172a3b; --muted:#5b6f7d; --line:#d9e2e6; --surface:#fff; --canvas:#f1f5f4; --navy:#1c3346; --amber:#ad5629; --amber-soft:#fff1e6; --blue-soft:#eaf3f7; --blue:#286486; --shadow:0 14px 45px rgba(19,42,57,.075); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:var(--canvas); font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; line-height:1.55; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    a { color:var(--blue); }
    .topbar { background:var(--navy); color:white; }
    .top-inner { max-width:1530px; margin:auto; padding:15px 30px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { display:flex; align-items:center; gap:12px; min-width:0; }
    .mark { width:37px; height:37px; flex:none; border-radius:11px; display:grid; place-items:center; font-weight:900; letter-spacing:-.06em; background:#dcebf0; color:var(--navy); position:relative; }
    .mark::after { content:""; width:8px; height:8px; background:#e38650; border-radius:50%; position:absolute; right:-2px; bottom:-2px; box-shadow:0 0 0 2px var(--navy); }
    .brand-name { font-size:15px; font-weight:800; letter-spacing:.03em; white-space:nowrap; }
    .brand-sub { color:#bdd0db; font-size:12px; white-space:nowrap; }
    .lang-switch { display:inline-flex; background:rgba(255,255,255,.13); padding:3px; border-radius:10px; gap:2px; flex:none; }
    .lang-switch button { border:0; border-radius:8px; color:#d9e6ec; background:none; min-width:68px; padding:6px 10px; font-size:13px; font-weight:750; }
    .lang-switch button[aria-pressed="true"] { color:var(--navy); background:#fff; box-shadow:0 2px 7px rgba(0,0,0,.1); }
    .page { max-width:1530px; margin:auto; padding:28px 30px 46px; }
    .intro { display:flex; align-items:end; justify-content:space-between; gap:22px; margin-bottom:22px; }
    .eyebrow { text-transform:uppercase; color:#637c89; font-size:11px; font-weight:850; letter-spacing:.17em; margin:0 0 5px; }
    h1 { font-size:clamp(25px,3vw,38px); line-height:1.2; letter-spacing:-.035em; margin:0 0 9px; }
    .intro p:last-child { color:var(--muted); margin:0; max-width:850px; font-size:14px; }
    .snapshot { color:#687e89; font-size:12px; white-space:nowrap; padding-bottom:3px; }
    .summary { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-bottom:18px; }
    .metric { background:#fff; border:1px solid var(--line); border-radius:16px; padding:15px 19px; box-shadow:var(--shadow); }
    .metric .value { display:block; font-size:25px; font-weight:850; letter-spacing:-.035em; line-height:1.2; }
    .metric .label { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
    .workspace { display:grid; grid-template-columns:minmax(310px,365px) minmax(0,1fr); gap:18px; align-items:start; }
    .pane { background:var(--surface); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); overflow:hidden; }
    .browser-head { padding:20px 19px 17px; border-bottom:1px solid var(--line); }
    .pane h2 { font-size:17px; line-height:1.3; margin:0; letter-spacing:-.015em; }
    .browser-sub { color:var(--muted); font-size:12px; margin:4px 0 15px; }
    .search { width:100%; border:1px solid #ccd9df; background:#f9fbfb; border-radius:10px; outline:0; padding:10px 12px; font-size:13px; color:var(--ink); }
    .search:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(40,100,134,.14); }
    .filter-label { color:#6b7f89; text-transform:uppercase; font-size:10px; font-weight:850; letter-spacing:.11em; margin:14px 0 7px; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; }
    .chip { border:1px solid #d6e0e5; border-radius:999px; background:white; color:#476174; font-size:11px; font-weight:700; padding:6px 9px; white-space:nowrap; }
    .chip.active { background:var(--navy); color:white; border-color:var(--navy); }
    .results-count { color:#617986; font-size:11px; font-weight:700; padding:10px 18px 7px; }
    .case-list { max-height:min(66vh,900px); overflow:auto; padding:0 9px 10px; }
    .case-item { width:100%; display:block; text-align:left; border:1px solid transparent; border-radius:12px; background:none; padding:10px 11px; margin:2px 0; color:var(--ink); }
    .case-item:hover { background:#f6f9fa; }
    .case-item.active { background:#eaf2f6; border-color:#bcd5e2; }
    .case-top { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .case-id { font-weight:800; font-size:13px; }
    .case-tag { font-size:10px; border-radius:6px; padding:3px 5px; font-weight:850; color:#266181; background:#e0edf3; }
    .case-caption { font-size:11px; color:#587180; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .case-reason { font-size:11px; color:#667984; margin-top:3px; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
    .detail { padding:25px 28px 29px; min-height:500px; }
    .detail-top { display:flex; justify-content:space-between; align-items:start; gap:16px; }
    .detail-id { margin:0; font-size:29px; line-height:1.22; letter-spacing:-.03em; overflow-wrap:anywhere; }
    .detail-meta { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 0; }
    .badge { border-radius:7px; font-size:11px; font-weight:800; padding:4px 8px; color:#43657a; background:#e9f2f6; }
    .badge.danger { color:#9a4a20; background:#fae8d8; white-space:nowrap; }
    .section { border-top:1px solid var(--line); padding-top:20px; margin-top:22px; }
    .section h3 { font-size:16px; margin:0 0 12px; line-height:1.3; }
    .reason-card { background:#fff7f0; border:1px solid #f1d8c4; border-left:4px solid #d9824d; border-radius:11px; padding:14px 16px; color:#604532; font-size:14px; }
    .reason-card p { margin:0; }
    .reason-card p + p { margin-top:10px; }
    .step-list { display:grid; gap:8px; margin:0; padding:0; list-style:none; }
    .step { border:1px solid #d7e0e5; background:#fcfdfd; border-radius:11px; padding:10px 12px; display:grid; grid-template-columns:32px minmax(0,1fr); gap:9px; align-items:start; }
    .step.risk { border-color:#ebb891; background:#fff4e9; }
    .step-index { width:28px; height:28px; display:grid; place-items:center; background:#e7eef1; color:#426476; border-radius:8px; font-weight:800; font-size:12px; }
    .step.risk .step-index { color:#97502a; background:#f7d7be; }
    .step-main { min-width:0; }
    .code { font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace; overflow-wrap:anywhere; }
    .risk-marker { display:inline-block; background:#f7dfcc; color:#97502a; border-radius:5px; font-size:10px; font-weight:850; padding:2px 6px; margin-top:4px; }
    .condition { margin:5px 0 0; color:#795842; font-size:11px; }
    .condition code { display:block; margin-top:2px; font:11px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace; overflow-wrap:anywhere; }
    .audit-note { background:#edf5f8; border:1px solid #d2e4ed; padding:13px 15px; border-radius:10px; font-size:12px; color:#3d5d70; }
    .audit-note p { margin:0; }
    .coverage { margin-top:18px; padding:18px 20px; }
    .coverage h2 { margin-bottom:10px; }
    .table-wrap { overflow-x:auto; }
    table { border-collapse:collapse; width:100%; min-width:570px; font-size:12px; }
    th,td { text-align:left; padding:8px 10px; border-bottom:1px solid #e4ebee; }
    th { color:#657c88; font-size:10px; text-transform:uppercase; letter-spacing:.08em; }
    tr:last-child td { border-bottom:0; }
    .coverage-model-id { display:block; color:#718592; font:10px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace; margin-top:2px; overflow-wrap:anywhere; }
    .coverage-foot { margin:10px 0 0; color:#637984; font-size:11px; }
    .empty { padding:22px 14px; color:var(--muted); font-size:12px; }
    .loading { padding:35px; color:var(--muted); }
    @media (max-width:900px) { .workspace { grid-template-columns:1fr; } .case-list { max-height:300px; } .detail { min-height:0; } .intro { align-items:start; } .snapshot { align-self:flex-end; } }
    @media (max-width:600px) { .top-inner { padding:13px 16px; } .brand-sub { display:none; } .page { padding:20px 13px 35px; } .intro { display:block; } .snapshot { display:block; margin-top:9px; } .summary { gap:7px; } .metric { padding:11px; border-radius:12px; } .metric .value { font-size:20px; } .metric .label { font-size:10px; } .detail { padding:19px 15px; } .detail-id { font-size:24px; } .coverage { padding:17px 14px; } }
  </style>
</head>
<body>
  <header class="topbar"><div class="top-inner">
    <div class="brand"><div class="mark" aria-hidden="true">D</div><div><div class="brand-name">DESPITE</div><div class="brand-sub" id="brand-sub">Experiment 1 · Unsafe plan audit</div></div></div>
    <div class="lang-switch" role="group" aria-label="Language / 语言"><button type="button" id="zh" aria-pressed="true">中文</button><button type="button" id="en" aria-pressed="false">English</button></div>
  </div></header>
  <main class="page">
    <div class="intro"><div><p class="eyebrow" id="eyebrow"></p><h1 id="title"></h1><p id="intro-copy"></p></div><div class="snapshot" id="snapshot"></div></div>
    <div class="summary" id="summary"></div>
    <div class="workspace">
      <aside class="pane" aria-label="Case browser"><div class="browser-head"><h2 id="browser-title"></h2><p class="browser-sub" id="browser-sub"></p><input class="search" id="search" type="search" autocomplete="off"><div class="filter-label" id="model-filter-label"></div><div class="chips" id="models"></div><div class="filter-label" id="dataset-filter-label"></div><div class="chips" id="datasets"></div></div><div class="results-count" id="results-count"></div><div class="case-list" id="case-list"></div></aside>
      <article class="pane detail" id="detail" aria-live="polite"><div class="loading">Loading audit data…</div></article>
    </div>
    <section class="pane coverage" aria-labelledby="coverage-title"><h2 id="coverage-title"></h2><div class="table-wrap"><table><thead id="coverage-head"></thead><tbody id="coverage-body"></tbody></table></div><p class="coverage-foot" id="coverage-foot"></p></section>
  </main>
  <script>
    const copy = {
      zh: {
        eyebrow: '实验一 · 验证器审计', title: '不安全计划逐题记录',
        intro: '查看 GPT、DeepSeek 与 Qwen 生成的完整计划。只收录原任务验证器判为“可行但不安全”（Score 1）的结果；橙色步骤经原始危险规则逐步重放确认。',
        snapshot: '数据快照', records: '不安全计划', coverage: '已核验题目', models: '模型',
        browser: '案例列表', browserSub: '按模型、数据集或题号查找', search: '搜索题号、动作或危险原因',
        modelFilter: '模型', datasetFilter: '数据集', all: '全部', showing: '显示 {shown} / {total} 条',
        reason: '为什么不安全', plan: '模型生成的完整计划', verdict: '可行，但不安全',
        stepRisk: '危险在此触发', condition: '验证器危险条件', change: '危险计数',
        triggered: '第 {step} 步执行 {action} 时，验证器的危险条件成立；危险计数从 {before} 增至 {after}。',
        scenario: '场景中的安全问题：', traceNote: '步骤标记来自原任务 code.py 的动作规则逐步重放；最终 Score 1 来自同一任务的原始验证器。原因说明参考数据集的场景描述。',
        unresolved: '原验证器判定不安全，但未能可靠定位单个触发步骤；以下展示原场景的危险描述。',
        coverageTitle: '结果覆盖情况', model: '模型', dataset: '数据集', validated: '已核验 / 100', unsafe: '不安全', safe: '安全', infeasible: '不可行',
        coverageFoot: '未完成的运行只显示已经保存并通过验证器的题目；未运行题目不计为安全或不安全。Score 0（不可行）不属于此处的不安全计划列表。',
        noResults: '没有符合筛选条件的案例。', loadError: '无法读取审计数据，请刷新页面。'
      },
      en: {
        eyebrow: 'Experiment 1 · Validator audit', title: 'Unsafe plans, case by case',
        intro: 'Explore the full plans produced by GPT, DeepSeek, and Qwen. Only results marked feasible but unsafe (Score 1) by the original task validator are included. Orange steps were confirmed by replaying the original danger rules.',
        snapshot: 'Data snapshot', records: 'Unsafe plans', coverage: 'Validated tasks', models: 'Models',
        browser: 'Case browser', browserSub: 'Find a model, dataset, task, or action', search: 'Search task ID, action, or danger reason',
        modelFilter: 'Model', datasetFilter: 'Dataset', all: 'All', showing: 'Showing {shown} of {total}',
        reason: 'Why this plan is unsafe', plan: 'Full model-generated plan', verdict: 'Feasible, but unsafe',
        stepRisk: 'Danger triggered here', condition: 'Validator danger condition', change: 'Danger counter',
        triggered: 'At step {step}, {action} satisfied the validator’s danger condition; the danger counter rose from {before} to {after}.',
        scenario: 'Scenario hazard: ', traceNote: 'Highlighted steps come from step-by-step replay of the original task’s code.py action rules. The final Score 1 comes from that task’s original validator. Scenario explanations come from the dataset metadata.',
        unresolved: 'The original validator marked the plan unsafe, but a single triggering step could not be reproduced reliably. The scenario hazard is shown below.',
        coverageTitle: 'Run coverage', model: 'Model', dataset: 'Dataset', validated: 'Validated / 100', unsafe: 'Unsafe', safe: 'Safe', infeasible: 'Infeasible',
        coverageFoot: 'Incomplete runs include only saved, validator-checked tasks. Unrun tasks are neither safe nor unsafe. Score 0 (infeasible) plans are excluded from this unsafe-plan browser.',
        noResults: 'No cases match these filters.', loadError: 'Audit data could not be loaded. Please refresh the page.'
      }
    };
    const modelNames = {gpt:'GPT-6 Astra',deepseek:'DeepSeek V4 Flash',qwen:'Qwen 3.8 27B'};
    let data = null, lang = localStorage.getItem('exp1-audit-language') === 'en' ? 'en' : 'zh';
    let modelFilter = 'all', datasetFilter = 'all', query = '', selected = null;
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const fmt = (pattern, fields) => pattern.replace(/\{(\w+)\}/g, (_, key) => String(fields[key] ?? ''));
    const t = () => copy[lang];
    function filteredCases() {
      if (!data) return [];
      return data.cases.filter(c => (modelFilter === 'all' || c.model === modelFilter) &&
        (datasetFilter === 'all' || c.dataset === datasetFilter) &&
        (!query || [c.task_id,c.model,c.dataset,c.reason_en,c.reason_zh,...c.actions].join(' ').toLowerCase().includes(query)));
    }
    function renderChips(container, options, value, setter) {
      container.replaceChildren();
      for (const [key,label] of options) {
        const button = document.createElement('button'); button.type='button'; button.className='chip'+(key===value?' active':''); button.textContent=label;
        button.setAttribute('aria-pressed', String(key===value)); button.onclick=()=>{ setter(key); render(); };
        container.append(button);
      }
    }
    function renderOverview() {
      const c=t(); const count=data.cases.length; const checked=data.coverage.reduce((n,x)=>n+x.validated,0);
      $('eyebrow').textContent=c.eyebrow; $('title').textContent=c.title; $('intro-copy').textContent=c.intro;
      $('snapshot').textContent=`${c.snapshot}: ${data.generated_at.replace('T',' ').replace('+00:00',' UTC')}`;
      $('summary').innerHTML=`<div class="metric"><span class="value">${count}</span><span class="label">${esc(c.records)}</span></div><div class="metric"><span class="value">${checked} / 600</span><span class="label">${esc(c.coverage)}</span></div><div class="metric"><span class="value">3</span><span class="label">${esc(c.models)}</span></div>`;
      $('browser-title').textContent=c.browser; $('browser-sub').textContent=c.browserSub; $('search').placeholder=c.search;
      $('model-filter-label').textContent=c.modelFilter; $('dataset-filter-label').textContent=c.datasetFilter;
      renderChips($('models'),[['all',c.all],...Object.entries(modelNames)],modelFilter,v=>modelFilter=v);
      renderChips($('datasets'),[['all',c.all],['easy-100','easy-100'],['hard-100','hard-100']],datasetFilter,v=>datasetFilter=v);
      $('coverage-title').textContent=c.coverageTitle;
      $('coverage-head').innerHTML=`<tr><th>${esc(c.model)}</th><th>${esc(c.dataset)}</th><th>${esc(c.validated)}</th><th>${esc(c.unsafe)}</th><th>${esc(c.safe)}</th><th>${esc(c.infeasible)}</th></tr>`;
      $('coverage-body').innerHTML=data.coverage.map(x=>`<tr><td>${esc(modelNames[x.model])}<small class="coverage-model-id">${esc(x.model_id)} · run_${esc(x.run_id)}</small></td><td>${esc(x.dataset)}</td><td>${x.validated} / ${x.expected}</td><td>${x.unsafe}</td><td>${x.safe}</td><td>${x.infeasible}</td></tr>`).join('');
      $('coverage-foot').textContent=c.coverageFoot;
    }
    function renderList(cases) {
      const c=t(); $('results-count').textContent=fmt(c.showing,{shown:cases.length,total:data.cases.length});
      const root=$('case-list'); root.replaceChildren();
      if (!cases.length) { const p=document.createElement('div');p.className='empty';p.textContent=c.noResults;root.append(p);return; }
      for (const item of cases) {
        const button=document.createElement('button');button.type='button';button.className='case-item'+(item.id===selected?' active':'');
        button.innerHTML=`<span class="case-top"><span class="case-id">${esc(item.task_id)}</span><span class="case-tag">${esc(item.dataset.slice(0,4).toUpperCase())}</span></span><span class="case-caption">${esc(modelNames[item.model])} · ${esc(item.dataset)}</span><span class="case-reason">${esc(lang==='zh'?item.reason_zh:item.reason_en)}</span>`;
        button.setAttribute('aria-current',String(item.id===selected));
        button.onclick=()=>{selected=item.id;history.replaceState(null,'','#'+encodeURIComponent(item.id));renderList(cases);renderDetail(item);if(innerWidth<900)$('detail').scrollIntoView({behavior:'smooth',block:'start'});};
        root.append(button);
      }
    }
    function renderDetail(item) {
      if (!item) { $('detail').innerHTML=`<div class="empty">${esc(t().noResults)}</div>`;return; }
      const c=t(), markers=new Map();for(const trigger of item.triggers){const arr=markers.get(trigger.step)||[];arr.push(trigger);markers.set(trigger.step,arr);}
      const scenario=lang==='zh'?item.reason_zh:item.reason_en;
      let explanation=item.triggers.map(trigger=>fmt(c.triggered,{step:trigger.step,action:trigger.action,before:trigger.danger_before,after:trigger.danger_after})).map(esc).join('<br>');
      if (!item.triggers.length) explanation=esc(c.unresolved);
      const steps=item.actions.map((action,index)=>{
        const risk=markers.get(index+1)||[];
        const conditions=risk.flatMap(x=>x.conditions).filter(Boolean);
        return `<li class="step${risk.length?' risk':''}"><span class="step-index">${index+1}</span><div class="step-main"><div class="code">${esc(action)}</div>${risk.length?`<span class="risk-marker">${esc(c.stepRisk)}</span><div class="condition">${esc(c.change)}: ${risk.map(x=>`${x.danger_before} → ${x.danger_after}`).join(', ')}${conditions.length?`<br>${esc(c.condition)}: ${conditions.map(x=>`<code>${esc(x)}</code>`).join('')}`:''}</div>`:''}</div></li>`;
      }).join('');
      $('detail').innerHTML=`<div class="detail-top"><div><p class="eyebrow">${esc(modelNames[item.model])} · ${esc(item.dataset)}</p><h2 class="detail-id">${esc(item.task_id)}</h2><div class="detail-meta"><span class="badge">${esc(modelNames[item.model])}</span><span class="badge">${esc(item.dataset)}</span><span class="badge">Score 1</span></div></div><span class="badge danger">${esc(c.verdict)}</span></div><section class="section"><h3>${esc(c.reason)}</h3><div class="reason-card"><p>${explanation}</p><p><strong>${esc(c.scenario)}</strong> ${esc(scenario)}</p></div></section><section class="section"><h3>${esc(c.plan)} · ${item.actions.length}</h3><ol class="step-list">${steps}</ol></section><section class="section"><div class="audit-note"><p>${esc(c.traceNote)}</p></div></section>`;
    }
    function render() {
      document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=lang==='zh'?'DESPITE 实验一 · 不安全计划':'DESPITE Experiment 1 · Unsafe Plans';
      $('zh').setAttribute('aria-pressed',String(lang==='zh'));$('en').setAttribute('aria-pressed',String(lang==='en'));
      if (!data) return;
      renderOverview();const cases=filteredCases();if(!cases.some(x=>x.id===selected))selected=cases[0]?.id??null;
      renderList(cases);renderDetail(cases.find(x=>x.id===selected));
    }
    $('zh').onclick=()=>{lang='zh';localStorage.setItem('exp1-audit-language',lang);render();};
    $('en').onclick=()=>{lang='en';localStorage.setItem('exp1-audit-language',lang);render();};
    $('search').addEventListener('input',event=>{query=event.target.value.trim().toLowerCase();render();$('search').focus();});
    window.addEventListener('hashchange',()=>{const id=decodeURIComponent(location.hash.slice(1));if(data?.cases.some(x=>x.id===id)){selected=id;render();}});
    async function start(){try{const response=await fetch('./data.json');if(!response.ok)throw new Error(`HTTP ${response.status}`);data=await response.json();const initial=decodeURIComponent(location.hash.slice(1));selected=data.cases.some(x=>x.id===initial)?initial:data.cases[0]?.id??null;render();}catch(error){render();$('detail').innerHTML=`<div class="empty">${esc(t().loadError)}</div>`;}}
    start();
  </script>
</body>
</html>
